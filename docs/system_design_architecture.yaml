      implementation: "Configuration validation before use"
      tags: ["safety", "settings", "validation"]
    
    backup_protection:
      description: "Automatic settings backup before changes"
      implementation: "Timestamped backup creation"
      tags: ["safety", "backup", "protection"]
  
  # Error handling patterns
