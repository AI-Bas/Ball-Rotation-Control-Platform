# =====================================================================
# SYSTEM DESIGN ARCHITECTURE - Ball Balancing Platform
#
# PURPOSE: Hardware and software architecture reference for implementation
# GRAPH GENERATION: Compatible with DOT and UML generation scripts
# AI AGENT SUPPORT: Tagged and labeled for automated code analysis
# CONFIGURATION: Default values only, current values in platform_config.json
# =====================================================================

system:
  name: "Ball Handler Test Platform"
  version: "1.0"
  description: "Three-wheel omni-directional ball balancing system for robot soccer applications"
  last_updated: "2025-01-29"
  license: "GNU GPL v3"
  purpose: "RoboCup football competition platform (academic and commercial use)"

# =====================================================================
# PHYSICAL SYSTEM PARAMETERS
# =====================================================================

physics:
  description: "Core physical parameters and motion control concepts"
  
  geometry:
    ball:
      radius: 0.111  # meters, default value
      reference: "platform_config.json:system_parameters.rBall"
      description: "Radius of the ball being balanced"
    
    omni_wheel:
      radius: 0.100  # meters, default value
      reference: "platform_config.json:system_parameters.rOmni"
      description: "Radius of the omni-directional wheels"
    
    wheel_positions:
      angles: [0.0, 120.0, 240.0]  # degrees from X-axis
      positions:
        - [0.0, 0.1]      # X-axis wheel
        - [-0.0866, -0.05] # 120° wheel
        - [0.0866, -0.05]  # 240° wheel
      wheel4:
        type: "linear_stage_drive"
        controller: "RC2 Channel B"
        port: "COM4"
        description: "Future linear stage drive"
    
    offsets:
      vertical_offset: -0.0555  # meters, default: half ball radius
      horizontal_offset: 0.0555  # meters, default: half ball radius
      reference: "platform_config.json:system_parameters.rZ, rX"
    
    wheel_separation:
      angle_between_wheels: 120.0  # degrees, default
      reference: "platform_config.json:system_parameters.beta"
  
  motion_control:
    kinematic_transformation:
      description: "Inverse/forward kinematics for ball-wheel mapping"
      functions: ["jacobian_calculation", "translation_to_rotation", "wheel_velocity_mapping", "feedback_processing"]
    
    setpoint_generation:
      description: "Motor driver agnostic setpoint generation for motion control"
      types:
        position_setpoints:
          profiles: ["trapezoidal", "smooth"]
          parameters: ["duration", "samples", "amplitude"]
        velocity_setpoints:
          parameters: ["acceleration_limit", "max_velocity"]
        acceleration_setpoints:
          parameters: ["max_acceleration"]
        indexed_sequences:
          parameters: ["start_velocity", "max_velocity", "ramp_time", "motor_confirmation", "timeout"]
      motor_confirmation:
        options: ["skip", "confirm", "deny"]
        parameters: ["timeout", "auto_confirm", "target_confirmations", "max_attempts"]
    
    control_parameters:
      sample_time: 0.01  # seconds, default
      buffer_duration: 60.0  # seconds, default
      plot_update_interval: 0.5  # seconds, default
      pid_gains: [1.0, 0.01, 0.001]  # [kp, ki, kd]
      reference: "platform_config.json:initial_conditions.control_loop"
    
    initial_conditions:
      translation_velocity: [0.0, 0.0]  # [vx, vy] m/s
      ball_angular_velocity: [0.0, 0.0, 0.0]  # [wx, wy, wz] rad/s

# =====================================================================
# HARDWARE ARCHITECTURE
# =====================================================================

hardware:
  description: "Physical hardware components and their specifications"
  
  motor_controllers:
    type: "RoboClaw 2x30A"
    quantity: 2
    communication:
      primary: "USB"
      fallback: "RS232"
      baud_rates: [460800, 38400, 115200, 57600, 9600]
      addresses: ["0x80", "0x80"]  # Both controllers
      timeout: 0.01  # seconds
      retries: 3
      command_delay: 0.01  # seconds between commands
    
    controllers:
      rc1:
        port: "COM5"
        address: "0x80"
        channels: [1, 2]
        motors: ["motor1", "motor2"]
        description: "Primary controller for motors 1 and 2"
      rc2:
        port: "COM4"
        address: "0x80"
        channels: [3, 4]
        motors: ["motor3", "motor4"]
        description: "Secondary controller for motors 3 and 4"
    
    pin_functions:
      s3: "E-Stop (mode 1) - Emergency stop functionality, non-inverted, non-latching"
      s4: "Voltage clamp (mode 2) - Voltage monitoring and clamping, non-inverted, non-latching"
      s5: "Voltage clamp (mode 2) - Voltage monitoring and clamping, non-inverted, non-latching"
    
    reference: "platform_config.json:hardware.roboclaw"
  
  motors:
    type: "Maxon DCX35L"
    quantity: 3  # Currently implemented
    specifications:
      encoder_cpr: 512  # counts per revolution
      gear_reduction: 4.333
      motor_constant: 699  # RPM/V
      nominal_voltage: 12  # volts
      nominal_current: 6  # amps
      peak_current: 60  # amps
    reference: "platform_config.json:motor_defaults"
  
  motor_mapping:
    motors:
      motor1: ["rc1", "A", "COM5", "0x80", "X-axis (0°)"]
      motor2: ["rc1", "B", "COM5", "0x80", "120° from X-axis"]
      motor3: ["rc2", "A", "COM4", "0x80", "240° from X-axis"]
      motor4: ["rc2", "B", "COM4", "0x80", "Linear stage (future)"]
    reference: "platform_config.json:hardware.roboclaw.motor_mapping"
  
  sensors:
    optical_flow:
      model: "PAA5100JE-Q"
      interface: "SPI"
      configuration:
        spi_bus: 0
        spi_device: 0
        cs_pin: 8
        reset_pin: 12
        motion_pin: 16
      purpose: "Ball position and velocity tracking"
      features: ["High-resolution motion detection", "Motion tracking in X/Y directions", "SPI communication interface", "LED control for visual feedback"]
      library: "pip package: pmw3901 (PAA5100 class for PAA5100JE-Q sensor)"
      sensor_class: "from pmw3901 import PAA5100"
      reference: "platform_config.json:hardware.optical_flow"
    
    current_monitoring:
      model: "INA219"
      interface: "I2C"
      channels: 4
      addresses: ["0x40", "0x41", "0x42", "0x43"]
      purpose: "Real-time current monitoring for each motor"
      features: ["Multi-channel current monitoring", "Battery voltage monitoring", "I2C communication interface", "Configurable measurement ranges"]
      library: "pip package: ina219 (migrated from local implementation)"
      reference: "platform_config.json:hardware.current_sensor"
  
  experimental_modules:
    maker_pi:
      type: "Maker Pi RP2040"
      purpose: "Experimental sensors, displays, and IO modules"
      responsibility: "experimental_modules_only"
      note: "Core motion control sensors handled by Raspberry Pi 5"
      communication: "USB connection to Raspberry Pi 5 running CircuitPython locally"
      integration_strategy:
        platform: "CircuitPython (recommended over MicroPython)"
        communication_protocol: "JSON over UART at 115200 baud"
        file_transfer: "USB mass storage for code upload/download"
        backup_system: "Automatic backup of code.py before changes"
        uart_commands: ["read_sensors", "set_leds", "set_motors", "get_status"]
        response_format: "JSON with status, data, message, and timestamp"
      modules:
        experimental_sensors: "Future experimental sensor modules (NOT core motion control sensors)"
        displays: "Future display modules for user interface and status"
        io_modules: "Future IO modules for additional functionality"
      reference: "platform_config.json:hardware.maker_pi"
  
  hardware_responsibilities:
    raspberry_pi_5:
      role: "Core motion control"
      responsibilities: ["Encoder feedback from RoboClaw controllers", "Optical flow sensor (PAA5100JE-Q) for ball motion detection", "Power sensor (INA219) for current and voltage monitoring", "Primary motion control loop and system coordination"]
      note: "Handles all core motion control sensors centrally"
    
    maker_pi_rp2040:
      role: "Experimental modules"
      responsibilities: ["Experimental sensor modules (future)", "Display modules (future)", "IO modules (future)"]
      note: "Clear separation ensures motion control loop performance is not affected"

