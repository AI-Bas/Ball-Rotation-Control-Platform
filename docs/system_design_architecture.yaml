      ina219: "Current sensor interface (pip package)"
      gpiod: "GPIO library for PMW3901"
      gpiodevice: "GPIO device library for PMW3901"
      typing_extensions: "Type hints support"
      pytest: "Testing framework"
      jupyter: "Development and notebook support"
      tags: ["external", "dependencies"]
  
  hardware_dependencies:
    roboclaw_controllers: "RoboClaw 2x30A motor controllers"
    ina219_sensors: "INA219 power monitoring ICs"
    pmw3901_sensor: "PMW3901/PAA5100 optical flow sensor"
    usb_serial: "USB-to-Serial converters"
    i2c_spi: "I2C/SPI interfaces"
    tags: ["hardware", "dependencies"]

