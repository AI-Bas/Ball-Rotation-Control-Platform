  core:
    platform_control:
      depends_on: ["roboclaw_interface", "kinematic_conversion", "pid_controller", "optical_flow_sensor", "power_sensor"]
      tags: ["core", "dependencies"]
    
    roboclaw_interface:
      depends_on: ["roboclaw_3", "platform_config.json"]
      tags: ["motor_control", "dependencies"]
    
    roboclaw_test_utils:
      depends_on: ["roboclaw_interface"]
      tags: ["testing", "dependencies"]
  
  configuration:
    all_modules:
      depends_on: "platform_config.json"
      tags: ["configuration", "dependencies"]
    
    test_modules:
