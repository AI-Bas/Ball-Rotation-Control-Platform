# =====================================================================
# MODULE DEPENDENCIES
# =====================================================================

dependencies:
  description: "Explicit dependency mapping for AI agent navigation"
  
  # Core dependencies
  core:
    platform_control:
      depends_on:
        - "roboclaw_interface"
        - "kinematic_conversion"
        - "pid_controller"
        - "optical_flow_sensor"
        - "power_sensor"
      tags: ["core", "dependencies"]
    
  roboclaw_interface:
      depends_on:
        - "roboclaw_3"
        - "platform_config.json"
      tags: ["motor_control", "dependencies"]
    
  roboclaw_test_utils:
      depends_on:
        - "roboclaw_interface"
      tags: ["testing", "dependencies"]
  
  # Configuration dependencies
  configuration:
    all_modules:
      depends_on: "platform_config.json"
      tags: ["configuration", "dependencies"]
    
    test_modules:
      depends_on: "test_logs/ directory"
      tags: ["testing", "dependencies"]
    
    settings_modules:
      depends_on: "roboclaw_settings_backup/ directory"
      tags: ["settings", "dependencies"]
  
  # External dependencies
  external:
    python_packages:
      numpy: "Numerical computations"
      pyserial: "Serial communication"
      smbus2: "I2C communication"
      spidev: "SPI communication"
      pywin32: "Windows-specific functionality"
      matplotlib: "Visualization and plotting"
      RPi.GPIO: "Raspberry Pi GPIO control"
      pmw3901: "Optical flow sensor interface"
      typing_extensions: "Type hints support"
      pytest: "Testing framework"
      jupyter: "Development and notebook support"
      tags: ["external", "dependencies"]
  
  # Hardware dependencies
  hardware_dependencies:
