# =====================================================================
# SYSTEM DESIGN ARCHITECTURE - Ball Balancing Platform
#
# PURPOSE: Hardware and software architecture reference for implementation
# GRAPH GENERATION: Compatible with DOT and UML generation scripts
# AI AGENT SUPPORT: Tagged and labeled for automated code analysis
# CONFIGURATION: Default values only, current values in platform_config.json
# =====================================================================

system:
  name: "Ball Handler Test Platform"
  version: "1.0"
  description: "Three-wheel omni-directional ball balancing system for robot soccer applications"
  last_updated: "2025-01-29"
  license: "GNU GPL v3"
  purpose: "RoboCup football competition platform (academic and commercial use)"

# =====================================================================
# PHYSICAL SYSTEM PARAMETERS
# =====================================================================

physics:
  description: "Core physical parameters and motion control concepts"
  
  geometry:
    ball:
      radius: 0.111  # meters, default value
      reference: "platform_config.json:system_parameters.rBall"
      description: "Radius of the ball being balanced"
    
    omni_wheel:
      radius: 0.100  # meters, default value
      reference: "platform_config.json:system_parameters.rOmni"
      description: "Radius of the omni-directional wheels"
    
    wheel_positions:
      angles: [0.0, 120.0, 240.0]  # degrees from X-axis
      positions:
        - [0.0, 0.1]      # X-axis wheel
        - [-0.0866, -0.05] # 120° wheel
        - [0.0866, -0.05]  # 240° wheel
      wheel4:
        type: "linear_stage_drive"
        controller: "RC2 Channel B"
        port: "COM4"
        description: "Future linear stage drive"
    
    offsets:
      vertical_offset: -0.0555  # meters, default: half ball radius
      horizontal_offset: 0.0555  # meters, default: half ball radius
      reference: "platform_config.json:system_parameters.rZ, rX"
    
    wheel_separation:
      angle_between_wheels: 120.0  # degrees, default
      reference: "platform_config.json:system_parameters.beta"
  
  roboclaw_control:
    kinematic_transformation:
      description: "Inverse/forward kinematics for ball-wheel mapping"
      functions: ["jacobian_calculation", "translation_to_rotation", "wheel_velocity_mapping", "feedback_processing"]
    
    setpoint_generation:
      description: "Motor driver agnostic setpoint generation for motion control"
      types:
        position_setpoints:
          profiles: ["trapezoidal", "smooth"]
          parameters: ["duration", "samples", "amplitude"]
        velocity_setpoints:
          parameters: ["acceleration_limit", "max_velocity"]
        acceleration_setpoints:
          parameters: ["max_acceleration"]
        indexed_sequences:
          parameters: ["start_velocity", "max_velocity", "ramp_time", "motor_confirmation", "timeout"]
      motor_confirmation:
        options: ["skip", "confirm", "deny"]
        parameters: ["timeout", "auto_confirm", "target_confirmations", "max_attempts"]
    
    control_parameters:
      sample_time: 0.01  # seconds, default
      buffer_duration: 60.0  # seconds, default
      plot_update_interval: 0.5  # seconds, default
      pid_gains: [1.0, 0.01, 0.001]  # [kp, ki, kd]
      reference: "platform_config.json:initial_conditions.control_loop"
    
    initial_conditions:
      translation_velocity: [0.0, 0.0]  # [vx, vy] m/s
      ball_angular_velocity: [0.0, 0.0, 0.0]  # [wx, wy, wz] rad/s

# =====================================================================
# HARDWARE ARCHITECTURE
# =====================================================================

hardware:
  description: "Physical hardware components and their specifications"
  
  motor_controllers:
    type: "RoboClaw 2x30A"
    quantity: 2
    communication:
      primary: "USB"
      fallback: "RS232"
      baud_rates: [460800, 38400, 115200, 57600, 9600]
      addresses: ["0x80", "0x80"]  # Both controllers
      timeout: 0.01  # seconds
      retries: 3
      command_delay: 0.01  # seconds between commands
    
    controllers:
      rc1:
        port: "COM5"
        address: "0x80"
        channels: [1, 2]
        motors: ["motor1", "motor2"]
        description: "Primary controller for motors 1 and 2"
      rc2:
        port: "COM4"
        address: "0x80"
        channels: [3, 4]
        motors: ["motor3", "motor4"]
        description: "Secondary controller for motors 3 and 4"
    
    pin_functions:
      s3: "E-Stop (mode 1) - Emergency stop functionality, non-inverted, non-latching"
      s4: "Voltage clamp (mode 2) - Voltage monitoring and clamping, non-inverted, non-latching"
      s5: "Voltage clamp (mode 2) - Voltage monitoring and clamping, non-inverted, non-latching"
    
    reference: "platform_config.json:hardware.roboclaw"
  
  motors:
    type: "Maxon DCX35L"
    quantity: 3  # Currently implemented
    specifications:
      encoder_cpr: 512  # counts per revolution
      gear_reduction: 4.333
      motor_constant: 699  # RPM/V
      nominal_voltage: 12  # volts
      nominal_current: 6  # amps
      peak_current: 60  # amps
    reference: "platform_config.json:motor_defaults"
  
  motor_mapping:
    motors:
      motor1: ["rc1", "A", "COM5", "0x80", "X-axis (0°)"]
      motor2: ["rc1", "B", "COM5", "0x80", "120° from X-axis"]
      motor3: ["rc2", "A", "COM4", "0x80", "240° from X-axis"]
      motor4: ["rc2", "B", "COM4", "0x80", "Linear stage (future)"]
    reference: "platform_config.json:hardware.roboclaw.motor_mapping"
  
  sensors:
    optical_flow:
      model: "PAA5100JE-Q"
      interface: "SPI"
      configuration:
        spi_bus: 0
        spi_device: 0
        cs_pin: 8
        reset_pin: 12
        motion_pin: 16
      purpose: "Ball position and velocity tracking"
      features: ["High-resolution motion detection", "Motion tracking in X/Y directions", "SPI communication interface", "LED control for visual feedback"]
      library: "pip package: pmw3901 (PAA5100 class for PAA5100JE-Q sensor)"
      sensor_class: "from pmw3901 import PAA5100"
      reference: "platform_config.json:hardware.optical_flow"
    
    current_monitoring:
      model: "INA219"
      interface: "I2C"
      channels: 4
      addresses: ["0x40", "0x41", "0x42", "0x43"]
      purpose: "Real-time current monitoring for each motor"
      features: ["Multi-channel current monitoring", "Battery voltage monitoring", "I2C communication interface", "Configurable measurement ranges"]
      library: "pip package: ina219 (migrated from local implementation)"
      reference: "platform_config.json:hardware.current_sensor"
  
  experimental_modules:
    maker_pi:
      type: "Maker Pi RP2040"
      purpose: "Experimental sensors, displays, and IO modules"
      responsibility: "experimental_modules_only"
      note: "Core motion control sensors handled by Raspberry Pi 5"
      communication: "USB connection to Raspberry Pi 5 running CircuitPython locally"
      integration_strategy:
        platform: "CircuitPython (recommended over MicroPython)"
        communication_protocol: "JSON over UART at 115200 baud"
        file_transfer: "USB mass storage for code upload/download"
        backup_system: "Automatic backup of code.py before changes"
        uart_commands: ["read_sensors", "set_leds", "set_motors", "get_status"]
        response_format: "JSON with status, data, message, and timestamp"
      modules:
        experimental_sensors: "Future experimental sensor modules (NOT core motion control sensors)"
        displays: "Future display modules for user interface and status"
        io_modules: "Future IO modules for additional functionality"
      reference: "platform_config.json:hardware.maker_pi"
  
  hardware_responsibilities:
    raspberry_pi_5:
      role: "Core motion control"
      responsibilities: ["Encoder feedback from RoboClaw controllers", "Optical flow sensor (PAA5100JE-Q) for ball motion detection", "Power sensor (INA219) for current and voltage monitoring", "Primary motion control loop and system coordination"]
      note: "Handles all core motion control sensors centrally"
    
    maker_pi_rp2040:
      role: "Experimental modules"
      responsibilities: ["Experimental sensor modules (future)", "Display modules (future)", "IO modules (future)"]
      note: "Clear separation ensures motion control loop performance is not affected"

# =====================================================================
# SOFTWARE ARCHITECTURE
# =====================================================================

software:
  description: "Software modules and their relationships"
  
  core_modules:
    platform_control:
      file: "platform_control/platform_control.py"
      description: "Main platform control process integrating all modules"
      dependencies: ["roboclaw_interface", "roboclaw_control", "power_sensor", "optical_flow_sensor"]
      features: ["Continuous operation", "Modular integration", "Hardware abstraction"]
      tags: ["core", "integration", "main_process"]
    
    roboclaw_interface:
      file: "platform_control/utils/roboclaw_interface.py"
      description: "RoboClaw-specific motor controller interface"
      dependencies: ["roboclaw_3.py", "platform_config.json"]
      features: ["Dual controller support", "USB/RS232 communication", "Settings management", "Motor data reading"]
      key_methods: ["connect()", "set_velocity()", "get_motor_data()", "read_and_save_settings()"]
      interdependencies: ["Motor data reading depends on connection", "Settings require valid addresses", "Error state depends on pin configuration"]
      tags: ["hardware", "roboclaw", "motor_control"]
    
    roboclaw_control:
      file: "platform_control/utils/roboclaw_control.py"
      description: "RoboClaw-specific motion control and motor interface"
      dependencies: ["roboclaw_interface"]
      features: ["RoboClawMotorInterface", "CalibrationUtilities"]
      key_methods: ["set_velocity()", "get_motor_status()", "stop_motor()"]
      tags: ["roboclaw_control", "roboclaw", "utilities"]
    
    setpoint_generator:
      file: "platform_control/utils/setpoint_generator.py"
      description: "RoboClaw-specific setpoint generation and motion profiles"
      dependencies: ["numpy"]
      features: ["Velocity setpoints", "Position setpoints", "Motion profiles (trapezoidal, smooth)"]
      key_methods: ["generate_velocity_setpoint()", "generate_position_setpoint()", "generate_calibration_setpoints()"]
      tags: ["setpoints", "motion_profiles", "utilities"]
    
    kinematic_conversion:
      file: "platform_control/utils/kinematic_conversion.py"
      description: "Kinematic transformations for ball-wheel mapping"
      dependencies: ["numpy"]
      features: ["Jacobian calculation", "Inverse kinematics", "Forward kinematics"]
      key_methods: ["jacobian()"]
      tags: ["kinematics", "mathematics", "utilities"]
  
  sensor_modules:
    power_sensor:
      file: "platform_control/utils/power_sensor.py"
      description: "INA219 power sensor interface"
      dependencies: ["ina219 pip package"]
      features: ["Multi-channel current monitoring", "Voltage monitoring", "I2C communication"]
      tags: ["sensor", "power", "ina219"]
    
    optical_flow_sensor:
      file: "platform_control/utils/optical_flow_sensor.py"
      description: "PAA5100JE-Q optical flow sensor interface"
      dependencies: ["pmw3901 pip package"]
      features: ["Motion detection", "SPI communication", "LED control"]
      tags: ["sensor", "optical_flow", "paa5100"]
  
  utility_modules:
    data_logger:
      file: "platform_control/utils/data_logger.py"
      description: "Data logging and analysis utilities"
      features: ["Real-time data logging", "Performance analysis", "Data visualization"]
      tags: ["utilities", "logging", "analysis"]
    
    autopilot_manager:
      file: "platform_control/utils/autopilot_manager.py"
      description: "Autonomous test execution management"
      features: ["Input queue management", "Test automation", "Menu navigation"]
      tags: ["utilities", "testing", "automation"]
    
    roboclaw_test_utils:
      file: "platform_control/utils/roboclaw_test_utils.py"
      description: "RoboClaw testing and troubleshooting utilities"
      dependencies: ["roboclaw_interface"]
      features: ["Error state diagnostics", "Pin function management", "Settings backup/restore"]
      tags: ["utilities", "testing", "roboclaw"]
  
  test_modules:
    connectivity_test:
      file: "platform_control/tests/connectivity_test.py"
      description: "System-wide connectivity tests for all hardware modules"
      features: ["Hardware detection", "Communication validation", "Error handling"]
      tags: ["testing", "connectivity", "system_wide"]
    
    roboclaw_test:
      file: "platform_control/tests/roboclaw_test.py"
      description: "RoboClaw error state and pin diagnostic tests"
      dependencies: ["roboclaw_interface", "roboclaw_test_utils"]
      features: ["Error state reading", "Pin function management", "Settings diagnostics"]
      tags: ["testing", "roboclaw", "diagnostics"]
    
    calibration_test:
      file: "platform_control/tests/calibration_test.py"
      description: "Comprehensive RoboClaw motor calibration and testing"
      dependencies: ["roboclaw_interface", "roboclaw_control", "setpoint_generator"]
      features: ["Motor mapping validation", "Velocity calibration", "Motion confirmation"]
      tags: ["testing", "calibration", "roboclaw"]
    
    motor_control_test:
      file: "platform_control/tests/motor_control_test.py"
      description: "RoboClaw motor control and current monitoring tests"
      dependencies: ["roboclaw_interface", "roboclaw_control", "power_sensor"]
      features: ["Velocity control", "Current monitoring", "Motor status validation"]
      tags: ["testing", "motor_control", "roboclaw"]
    
    system_test:
      file: "platform_control/tests/system_test.py"
      description: "System-wide test orchestration"
      dependencies: ["All test modules"]
      features: ["Test coordination", "Result aggregation", "System validation"]
      tags: ["testing", "orchestration", "system_wide"]
  
  experimental_modules:
    maker_pi_interface:
      file: "platform_control/utils/maker_pi_interface.py"
      description: "Maker Pi RP2040 experimental module interface"
      features: ["UART communication", "CircuitPython integration", "Experimental sensors"]
      tags: ["experimental", "maker_pi", "rp2040"]
  
  dependencies:
    external_libraries:
      roboclaw_3:
        file: "platform_control/utils/roboclaw_3.py"
        description: "Core RoboClaw library with all command implementations"
        features: ["All RoboClaw commands", "Serial communication", "CRC checking"]
        tags: ["library", "roboclaw", "core"]
      
      numpy:
        package: "pip"
        description: "Numerical computing for kinematics and setpoints"
        tags: ["library", "mathematics", "external"]
      
      pmw3901:
        package: "pip"
        description: "Optical flow sensor library"
        tags: ["library", "sensor", "external"]
      
      ina219:
        package: "pip"
        description: "Power sensor library"
        tags: ["library", "sensor", "external"]
    
    configuration:
      platform_config:
        file: "platform_control/config/platform_config.json"
        description: "Central configuration for all system parameters"
        features: ["Hardware settings", "Motor mappings", "System parameters"]
        tags: ["configuration", "central", "json"]

# =====================================================================
# DATA FLOW ARCHITECTURE
# =====================================================================

data_flow:
  description: "Data flow, configuration management, and communication patterns"
  
  configuration:
    platform_config:
      file: "test_platform_control/config/platform_config.json"
      purpose: "Central configuration file"
      sections: ["system_parameters", "hardware", "motor_defaults", "roboclaw_settings_reference", "testing"]
      features: ["Dynamic updates on connection failures", "Automatic configuration updates", "Configuration validation before connection attempts"]
      tags: ["configuration", "json", "central"]
    
    settings_backup:
      directory: "test_platform_control/tests/roboclaw_settings_backup/"
      purpose: "Timestamped settings snapshots"
      format: "JSON with timestamps"
      filename_format: "roboclaw_settings_YYYYMMDD_HHMMSS.json"
      features: ["Automatic backup creation", "Settings comparison", "Restoration capabilities", "Reference settings comparison with detailed difference reporting", "Complete settings restoration from backup files", "NVM storage for permanent settings changes"]
      tags: ["backup", "settings", "snapshots"]
    
    maker_pi_settings_backup:
      directory: "test_platform_control/tests/maker_pi_settings_backup/"
      purpose: "Maker Pi CircuitPython code.py backups"
      format: "Python files with timestamps"
      filename_format: "code_py_backup_YYYYMMDD_HHMMSS_DRIVE.py"
      features: ["Automatic code.py backup creation", "CircuitPython drive detection", "Code content preservation", "Timestamped backup files", "Drive-specific backup naming"]
      tags: ["backup", "maker_pi", "circuitpython"]
  
  logging:
    test_logs:
      directory: "test_platform_control/tests/test_logs/"
      format: "JSON with timestamps"
      content: ["Test results and outcomes", "Error logging and troubleshooting", "Settings comparisons", "Performance metrics", "Detailed test reports with timestamps"]
      tags: ["logging", "test_results", "json"]
    
    real_time_data:
      format: "CSV for data logging"
      content: ["Encoder values", "Current and voltage readings", "Temperature measurements", "Error status", "Motion control error logging of each feedback module"]
      update_interval: 0.5  # seconds
      tags: ["logging", "real_time", "csv"]
  
  communication:
    usb_mode:
      protocol: "USB virtual COM port"
      addresses: "0x80 for both controllers"
      automatic_handling: "No baud rate configuration needed"
      tags: ["communication", "usb", "primary"]
    
    rs232_mode:
      protocol: "RS232 serial communication"
      baud_rates: [460800, 38400, 115200, 57600, 9600]
      addresses: "0x80 for both controllers"
      timeout: 0.01
      retries: 3
      tags: ["communication", "rs232", "fallback"]

# =====================================================================
