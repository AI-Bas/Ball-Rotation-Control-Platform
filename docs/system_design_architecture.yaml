# =====================================================================

safety:
  description: "Safety features, error handling, and troubleshooting mechanisms"
  
  hardware_safety:
    e_stop_monitoring:
      description: "Real-time emergency stop status checking"
      implementation: "Error status bit monitoring"
      features: ["Immediate motor shutdown", "Non-inverted, non-latching functionality"]
      tags: ["safety", "e_stop", "hardware"]
    
    temperature_monitoring:
      description: "Over-temperature protection"
      implementation: "Temperature reading and limits"
      features: ["Overheating protection", "Controller temperature monitoring"]
      tags: ["safety", "temperature", "protection"]
    
    current_limiting:
      description: "Motor current limit enforcement"
      implementation: "Current monitoring and limits"
      features: ["Motor overload protection", "Configurable per-motor current limits"]
      tags: ["safety", "current", "limiting"]
    
    voltage_monitoring:
      description: "Battery voltage range checking"
      implementation: "Main and logic battery monitoring"
      features: ["Over/under voltage protection", "Voltage monitoring and clamping"]
      tags: ["safety", "voltage", "monitoring"]
  
  software_safety:
    error_status_checking:
      description: "Comprehensive error bit monitoring"
      implementation: "RoboClaw error status decoding"
      features: ["Motor faults, temperature, voltage issues", "Sensor failures", "Communication errors", "System faults"]
      tags: ["safety", "error", "software"]
    
    connection_verification:
      description: "Robust connection testing"
      implementation: "USB/RS232 connectivity verification"
      tags: ["safety", "connection", "verification"]
    
    settings_validation:
      description: "Settings range and validity checking"
      implementation: "Configuration validation before use"
      tags: ["safety", "settings", "validation"]
    
    backup_protection:
      description: "Automatic settings backup before changes"
      implementation: "Timestamped backup creation"
      tags: ["safety", "backup", "protection"]
  
  error_handling:
    connection_issues:
      usb_fallback: "Automatic fallback to RS232 if USB fails"
      baud_rate_fallback: "Primary to fallback baud rate switching"
      address_validation: "Hex format address parsing and validation"
      port_detection: "Automatic COM port detection and validation"
      troubleshooting: "Detailed error messages with possible causes"
      tags: ["error_handling", "connection", "fallback"]
    
    motor_identification:
      agnostic_approach: "Tests all port/channel combinations"
      encoder_monitoring: "Real-time encoder value tracking"
      interactive_assignment: "User-driven motor number assignment"
      configuration_saving: "Automatic motor mapping updates"
      tags: ["error_handling", "motor_id", "interactive"]

# =====================================================================
# MODULE DEPENDENCIES
# =====================================================================

dependencies:
